services:
  - type: web
    name: flask-spectacles
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn_config.py app:app"
    envVars:
      # === CRITICAL: Security ===
      - key: SECRET_KEY
        generateValue: true  # Render generates a random value, persists across deploys
      
      - key: FLASK_ENV
        value: production
      
      # === CRITICAL: Database (PostgreSQL) ===
      # Link to your Render PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      
      # === Admin credentials ===
      # Set these manually in Render dashboard for security
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      
      # === AWS S3 Configuration ===
      - key: S3_BUCKET
        value: spectacle-ment-votre
      - key: S3_KEY
        sync: false  # Set manually in Render dashboard for security
      - key: S3_SECRET
        sync: false  # Set manually in Render dashboard for security
      - key: S3_REGION
        value: eu-west-1

  # === Cron : purger les logs visiteurs > 30 jours (RGPD + éviter OOM sur /admin/statistiques) ===
  # NOTE: doit être créé aussi manuellement dans le dashboard Render — la déclaration YAML
  # seule ne suffit pas toujours à provisionner le cron.
  - type: cron
    name: clean-visitor-logs
    env: python
    schedule: "0 4 * * *"  # tous les jours à 04h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python clean_visitor_logs.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

  # Préavis le 5 (UTC), puis contrôle horaire des échéances de 48 h.
  # La ressource cron peut devoir être créée manuellement dans le dashboard Render.
  - type: cron
    name: purge-notified-inactive-accounts
    env: python
    schedule: "0 * * * *"  # vérifie chaque heure les échéances arrivées
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python purge_notified_inactive_accounts.py --automatic --confirm-notices --confirm-delete"
    envVars:
      # Utiliser la base du service Web réel, pas une ancienne base du même nom.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      # Copier les valeurs depuis le service Web réel, sans les afficher dans les logs.
      - key: PURGE_EXPECTED_DATABASE_ID
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # Relances des factures d'adhésion AO impayées (J+3, J+7, alerte admin J+10).
  # Doit utiliser la même base et les mêmes MAIL_* que le service web.
  - type: cron
    name: relances-factures-adhesion
    env: python
    schedule: "0 8 * * *"  # tous les jours à 08h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python relances_factures.py --apply"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # Rappels d'expiration d'abonnement AO (J-30, J-7, expiration + désactivation auto).
  # Idempotent (renewal_*_sent_for). Même base et mêmes MAIL_* que le service web.
  - type: cron
    name: rappels-abonnements
    env: python
    schedule: "0 7 * * *"  # tous les jours à 07h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python rappels_abonnements.py --apply"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # Alerte admin 30 jours avant la fin de l'accès gratuit d'un an (comptes d'avant le 12/09/2026).
  - type: cron
    name: alertes-fin-gratuite
    env: python
    schedule: "0 8 * * *"  # tous les jours à 08h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python alertes_fin_gratuite.py --apply"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

  # Désactivation des annonces d'animation parues depuis plus de 7 jours (acte en base).
  - type: cron
    name: deactivate-old-demandes
    env: python
    schedule: "0 6 * * *"  # tous les jours à 06h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python deactivate_old_demandes.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USE_SSL
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: flask-spectacles-db
    databaseName: flask_spectacles
    user: flask_user
    plan: free  # Change to 'starter' for production persistence beyond 90 days
