services:
  - type: web
    name: flask-spectacles
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn_config.py app:app"
    envVars:
      # === CRITICAL: Security ===
      - key: SECRET_KEY
        generateValue: true  # Render generates a random value, persists across deploys
      
      - key: FLASK_ENV
        value: production
      
      # === CRITICAL: Database (PostgreSQL) ===
      # Link to your Render PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      
      # === Admin credentials ===
      # Set these manually in Render dashboard for security
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      
      # === AWS S3 Configuration ===
      - key: S3_BUCKET
        value: spectacle-ment-votre
      - key: S3_KEY
        sync: false  # Set manually in Render dashboard for security
      - key: S3_SECRET
        sync: false  # Set manually in Render dashboard for security
      - key: S3_REGION
        value: eu-west-1

  # === Cron : marquer en préavis 2j les comptes inactifs (sans spectacle publié) ===
  - type: cron
    name: auto-flag-inactive-users
    env: python
    schedule: "0 3 * * *"  # tous les jours à 03h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python auto_flag_inactive_users.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # === Cron : supprimer définitivement les comptes en préavis dépassé ===
  - type: cron
    name: cleanup-pending-deletions
    env: python
    schedule: "30 3 * * *"  # tous les jours à 03h30 UTC (après le flag)
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cleanup_pending_deletions.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: flask-spectacles-db
    databaseName: flask_spectacles
    user: flask_user
    plan: free  # Change to 'starter' for production persistence beyond 90 days
