services:
  - type: web
    name: flask-spectacles
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn_config.py app:app"
    envVars:
      # === CRITICAL: Security ===
      - key: SECRET_KEY
        generateValue: true  # Render generates a random value, persists across deploys
      
      - key: FLASK_ENV
        value: production
      
      # === CRITICAL: Database (PostgreSQL) ===
      # Link to your Render PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      
      # === Admin credentials ===
      # Set these manually in Render dashboard for security
      - key: ADMIN_USERNAME
        sync: false  # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false  # Set manually in Render dashboard
      
      # === AWS S3 Configuration ===
      - key: S3_BUCKET
        value: spectacle-ment-votre
      - key: S3_KEY
        sync: false  # Set manually in Render dashboard for security
      - key: S3_SECRET
        sync: false  # Set manually in Render dashboard for security
      - key: S3_REGION
        value: eu-west-1

  # === Cron : purger les logs visiteurs > 30 jours (RGPD + éviter OOM sur /admin/statistiques) ===
  # NOTE: doit être créé aussi manuellement dans le dashboard Render — la déclaration YAML
  # seule ne suffit pas toujours à provisionner le cron.
  - type: cron
    name: clean-visitor-logs
    env: python
    schedule: "0 4 * * *"  # tous les jours à 04h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python clean_visitor_logs.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-spectacles-db
          property: connectionString
      - key: SECRET_KEY
        sync: false

databases:
  - name: flask-spectacles-db
    databaseName: flask_spectacles
    user: flask_user
    plan: free  # Change to 'starter' for production persistence beyond 90 days
